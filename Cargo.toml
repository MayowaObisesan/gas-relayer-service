[package]
name = "traffic_simulator"
version = "0.1.0"
edition = "2024"
# There are two binaries (`traffic_simulator` and `simulator`), so `cargo run` needs to be told
# which one is the default. Without this, *every* `cargo run` in the docs fails with
# "could not determine which binary to run".
default-run = "traffic_simulator"

[dependencies]
alloy = { version = "2.1.1", features = ["full"] }
axum = "0.8.9"
# `json` is already on transitively (via alloy); we ask for it explicitly so the
# simulator cannot silently break if that transitive feature ever goes away.
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
# Day 4: the relayer key lives in a `Zeroizing` buffer so it is wiped on drop.
zeroize = "1"
# Day 5 (keepers): `StreamExt`, to pull the next `Log` out of alloy's `eth_subscribe`
# stream in the watcher. Alloy returns a `Subscription` (a `Stream`); consuming a
# `Stream` requires exactly one `StreamExt` in scope. Alloy re-exports futures-core
# internally but deliberately does not re-export the extension trait, so the keeper
# depends on it directly rather than through alloy.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

